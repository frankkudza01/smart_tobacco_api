# Production-oriented Compose for a VPS. Does not replace docker-compose.yml (local dev).
#
# Run on the server (from this directory):
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Optional Hardhat local chain (matches notes.md npm workflow — compile/tests at image build; node always on 8545):
#   COMPOSE_PROFILES=blockchain docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#   bash deploy/deploy-hardhat-contract.sh
#
# Let's Encrypt (after DNS points here): see deploy/request-cert.sh
# Publish host port 443 once nginx TLS config is active:
#   INCLUDE_HTTPS_PORT=1 ./deploy/vps-deploy.sh up -d
#
# Local machine: keep using `docker compose up` with `.env` — leave this file unused locally.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tobacco_db}
      POSTGRES_USER: ${POSTGRES_USER:-tobacco_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tobacco_pass}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data_prod:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb local/${AWS_STORAGE_BUCKET_NAME:-tobacco-documents} --ignore-existing;
      mc anonymous set download local/${AWS_STORAGE_BUCKET_NAME:-tobacco-documents};
      exit 0;
      "
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/production.txt
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    volumes:
      - static_volume_prod:/app/staticfiles
    expose:
      - "8000"
    env_file:
      - .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/admin/login/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/production.txt
    command: celery -A config.celery_app worker -l info -c 4
    env_file:
      - .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/production.txt
    command: celery -A config.celery_app beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  # Hardhat dev chain (profile `blockchain`): npm ci + compile + test:solidity happen at image build time.
  # Equivalent to: npm run node (listens on 0.0.0.0:8545 inside the container).
  hardhat:
    build:
      context: ./hardhat
      dockerfile: Dockerfile
      args:
        SKIP_HARDHAT_TESTS: ${SKIP_HARDHAT_TESTS:-0}
    image: tobacco-traceability-hardhat:latest
    profiles:
      - blockchain
    ports:
      - "${HARDHAT_BIND:-127.0.0.1}:${HARDHAT_HOST_PORT:-8545}:8545"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -X POST -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"method\":\"eth_chainId\",\"params\":[],\"id\":1}' http://127.0.0.1:8545 >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/${NGINX_SITE_CONF:-nginx.prod.conf}:/etc/nginx/conf.d/default.conf:ro
      - static_volume_prod:/app/staticfiles:ro
      - certbot_webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  postgres_data_prod:
  minio_data_prod:
  static_volume_prod:
  certbot_webroot:
  letsencrypt:
