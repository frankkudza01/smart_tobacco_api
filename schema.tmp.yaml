  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Public registration endpoint for new users.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/auth/request-otp/:
    post:
      operationId: auth_request_otp_create
      description: |-
        POST /api/v1/auth/request-otp/
        Accepts a phone number, validates the user exists and is eligible,
        generates OTP, stores in Redis, enqueues WhatsApp delivery via Celery.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequestOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequestOTPRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestOTP'
          description: ''
  /api/v1/auth/resend-otp/:
    post:
      operationId: auth_resend_otp_create
      description: |-
        POST /api/v1/auth/resend-otp/
        Resend OTP if cooldown has elapsed.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendOTPRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendOTP'
          description: ''
  /api/v1/auth/verify-otp/:
    post:
      operationId: auth_verify_otp_create
      description: |-
        POST /api/v1/auth/verify-otp/
        Verifies OTP and issues JWT tokens on success.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOTP'
          description: ''
  /api/v1/blockchain/receipts/:
    get:
      operationId: blockchain_receipts_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: reference_type
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CONFIRMED
          - FAILED
          - PENDING
          - SUBMITTED
        description: |-
          * `PENDING` - Pending
          * `SUBMITTED` - Submitted
          * `CONFIRMED` - Confirmed
          * `FAILED` - Failed
      tags:
      - blockchain
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBlockchainReceiptList'
          description: ''
  /api/v1/blockchain/verify/:
    post:
      operationId: blockchain_verify_create
      tags:
      - blockchain
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnchorVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnchorVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnchorVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchorVerify'
          description: ''
  /api/v1/devices/register/:
    post:
      operationId: devices_register_create
      description: Register or refresh an FCM/APNs device token for the current user.
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegistration'
          description: ''
  /api/v1/disputes/:
    get:
      operationId: disputes_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - document
          - grading
          - sale
          - sequence
        description: |-
          * `grading` - Grading
          * `sale` - Sale
          * `document` - Document
          * `sequence` - Trace sequence
      - in: query
        name: lot
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: sale
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ESCALATED
          - OPEN
          - REJECTED
          - RESOLVED
          - UNDER_REVIEW
        description: |-
          * `OPEN` - Open
          * `UNDER_REVIEW` - Under Review
          * `RESOLVED` - Resolved
          * `REJECTED` - Rejected
          * `ESCALATED` - Escalated
      tags:
      - disputes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDisputeListList'
          description: ''
    post:
      operationId: disputes_create
      tags:
      - disputes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DisputeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DisputeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
          description: ''
  /api/v1/disputes/{id}/:
    get:
      operationId: disputes_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - disputes
      security:
      - jwtAuth: []
