    put:
      operationId: auth_profile_buyer_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyerProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BuyerProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BuyerProfileRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerProfile'
          description: ''
    patch:
      operationId: auth_profile_buyer_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBuyerProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBuyerProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBuyerProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerProfile'
          description: ''
  /api/v1/auth/profile/farmer/:
    get:
      operationId: auth_profile_farmer_retrieve
