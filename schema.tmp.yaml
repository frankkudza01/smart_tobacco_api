                $ref: '#/components/schemas/FarmerProfile'
          description: ''
    put:
      operationId: auth_profile_farmer_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmerProfileRequest'
          application/x-www-form-urlencoded:
            schema:
