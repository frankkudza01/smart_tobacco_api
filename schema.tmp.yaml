          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssistantChatRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssistantChatRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantChat'
          description: ''
  /api/v1/ai/exports/anomaly/:
    get:
      operationId: ai_exports_anomaly_retrieve
      description: Public GET with signed token only. Re-validates user role and access
        at download time.
      tags:
      - ai
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/ai/forecasts/price/:
    get:
      operationId: ai_forecasts_price_retrieve
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
