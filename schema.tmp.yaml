      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastQuery'
          description: ''
  /api/v1/ai/metrics/evaluation/:
    get:
      operationId: ai_metrics_evaluation_retrieve
      description: Offline AUROC / MAPE hooks — auditors and admins only.
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationMetric'
          description: ''
    post:
      operationId: ai_metrics_evaluation_create
      description: Offline AUROC / MAPE hooks — auditors and admins only.
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationMetricRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EvaluationMetricRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EvaluationMetricRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationMetric'
          description: ''
  /api/v1/ai/query/:
    post:
      operationId: ai_query_create
      description: Legacy `/ai/query/` — same hardened assistant as `/ai/assistant/chat/`.
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIQueryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIQueryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIQueryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIQuery'
          description: ''
  /api/v1/analytics/disputes/summary/:
    get:
      operationId: analytics_disputes_summary_retrieve
      summary: Dispute lifecycle metrics for the org (auditor/admin).
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: Start date (YYYY-MM-DD)
        required: true
      - in: query
        name: to
        schema:
          type: string
        description: End date (YYYY-MM-DD)
        required: true
      tags:
      - disputes
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/ux/tasks/:
    get:
      operationId: analytics_ux_tasks_retrieve
      parameters:
      - in: query
        name: from
