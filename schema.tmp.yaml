openapi: 3.0.3
info:
  title: AI-Enhanced Zimbabwe Tobacco Supply Chain API
  version: 1.0.0
  description: 'Backend API for the tobacco supply chain traceability platform. Errors
    use a standard envelope: success=false, data=null, meta, errors[]. List endpoints
    commonly return {results: [...]}; pagination uses page/limit (StandardPagination)
    unless noted (e.g. sync/changes uses since_timestamp).'
paths:
  /api/v1/ai/analytics/anomalies/duplicates/export-labels/:
    get:
      operationId: ai_analytics_anomalies_duplicates_export_labels_retrieve
      description: Export reviewer labels for duplicate/near-duplicate precision-recall
        analysis.
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/ai/anomalies/:
    get:
      operationId: ai_anomalies_retrieve
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/ai/anomalies/{alert_id}/case/:
    get:
      operationId: ai_anomalies_case_retrieve
      parameters:
      - in: path
        name: alert_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/ai/anomalies/{alert_id}/export-link/:
    get:
      operationId: ai_anomalies_export_link_retrieve
      description: 'Auditor/admin: mint a short-lived signed URL to download the case
        packet JSON.'
      parameters:
      - in: path
        name: alert_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/ai/anomalies/{alert_id}/label/:
    post:
      operationId: ai_anomalies_label_create
      parameters:
      - in: path
        name: alert_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewLabelRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewLabelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewLabelRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewLabel'
          description: ''
  /api/v1/ai/anomalies/run/:
